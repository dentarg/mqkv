name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and push gem
    runs-on: ubuntu-latest
    if: github.repository == 'dentarg/mqkv'
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Build gem
        run: gem build mqkv.gemspec

      - uses: rubygems/configure-rubygems-credentials@0fe86296841519356ad7dd2041187e0578738b91

      - name: Push gem
        run: gem push --verbose mqkv-*.gem

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes mqkv-*.gem
